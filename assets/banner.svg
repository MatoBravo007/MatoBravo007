<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="55%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f1e3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5f1e3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g opacity="0.5">
    <polygon points="500,-20 545,-20 660,340 440,340" fill="url(#ray)"/>
    <polygon points="590,-20 630,-20 705,340 530,340" fill="url(#ray)"/>
    <polygon points="660,-20 700,-20 790,340 610,340" fill="url(#ray)"/>
  </g>

  <g fill="#050505" stroke="#3a3a3a" stroke-width="0.5">
    <circle cx="120" cy="340" r="3.2">
      <animate attributeName="cy" values="360;-20" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="340" r="2.2">
      <animate attributeName="cy" values="360;-20" dur="7s" begin="1.2s" repeatCount="indefinite"/>
