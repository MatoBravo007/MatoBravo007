  <g transform="translate(600,228)" fill="#cfc9b8" opacity="0.9">
    <ellipse cx="-15" cy="0" rx="14" ry="7.5" transform="rotate(-25 -15 0)"/>
    <ellipse cx="15" cy="0" rx="14" ry="7.5" transform="rotate(25 15 0)"/>
    <rect x="-2.2" y="-10" width="4.4" height="20" rx="2.2"/>
  </g>

  <g stroke="#cfc9b8" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 300 252 C 400 272, 470 236, 600 236 C 730 236, 800 272, 900 252"/>
    <circle cx="300" cy="252" r="2.5" fill="#cfc9b8"/>
    <circle cx="900" cy="252" r="2.5" fill="#cfc9b8"/>
  </g>

  <text x="600" y="298" text-anchor="middle" font-family="Cinzel, Georgia, serif"
        font-size="23" letter-spacing="7" fill="#a9a496">@MATO_BRAVO007  •  VIBE CODER</text>
