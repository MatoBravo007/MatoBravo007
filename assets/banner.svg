    </circle>
    <circle cx="340" cy="340" r="3.6">
      <animate attributeName="cy" values="360;-20" dur="11s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="11s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="340" r="2">
      <animate attributeName="cy" values="360;-20" dur="8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.8;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="340" r="2.8">
      <animate attributeName="cy" values="360;-20" dur="10s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="10s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="340" r="2.2">
      <animate attributeName="cy" values="360;-20" dur="7.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.8;1" dur="7.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="340" r="3.4">
      <animate attributeName="cy" values="360;-20" dur="9.5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="9.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="340" r="2.4">
      <animate attributeName="cy" values="360;-20" dur="8.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.8;1" dur="8.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="340" r="3">
      <animate attributeName="cy" values="360;-20" dur="10.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="10.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="340" r="2.6">
      <animate attributeName="cy" values="360;-20" dur="9.2s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.8;1" dur="9.2s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#cfc9b8" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 300 96 C 400 76, 470 112, 600 112 C 730 112, 800 76, 900 96"/>
    <circle cx="300" cy="96" r="2.5" fill="#cfc9b8"/>
    <circle cx="900" cy="96" r="2.5" fill="#cfc9b8"/>
  </g>

  <text x="600" y="192" text-anchor="middle" font-family="Cinzel, Georgia, 'Times New Roman', serif"
